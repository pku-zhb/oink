name: Build physical monitor Windows preview
on:
  push:
    branches: [feat/physical-monitor-scenes]
    paths:
      - '.github/workflows/physical-monitor-preview.yml'
      - 'crates/**'
      - 'apps/oink/**'
      - 'Cargo.*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: physical-monitor-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.14.1'
          cache: npm
      - run: npm ci
      - run: npm run -w apps/oink build
      - name: Test shared monitor UI and localization
        run: npm run -w apps/oink test -- src/settings/PhysicalMonitors.test.tsx src/i18n/i18n.test.ts
      - name: Test physical monitor transactions with fake hardware
        run: cargo test --locked -p oink-agent --lib physical_monitors::
      - run: cargo build --release --locked -p oink-agent -p oink-ui -p oink-winsvc -p oink-crash --bins --features oink-ui/custom-protocol
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: physical-monitor-windows-x64
          retention-days: 7
          if-no-files-found: error
          path: |
            target/release/oink.exe
            target/release/oink-agent.exe
            target/release/oink-service.exe
            target/release/oink-crash-collector.exe
